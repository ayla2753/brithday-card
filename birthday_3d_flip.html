<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Friend</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', sans-serif;
        overflow: hidden;
    }

    /* 3D Card Container */
    .scene {
        width: 380px;
        height: 520px;
        perspective: 1000px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1.2s;
        cursor: pointer;
    }

    .scene:hover .card {
        transform: rotateY(180deg);
    }

    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 25px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        padding: 30px;
        box-sizing: border-box;
        text-align: center;
    }

    /* Front Side */
    .front {
        background: linear-gradient(135deg, #ff4b5c, #ff758c);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .front h1 {
        font-family: 'Pacifico', cursive;
        font-size: 48px;
        margin-bottom: 20px;
    }

    .front p {
        font-size: 18px;
    }

    /* Back Side */
    .back {
        background: white;
        transform: rotateY(180deg);
        color: #333;
    }

    .back h2 {
        font-family: 'Pacifico', cursive;
        color: #ff4b5c;
        font-size: 36px;
        margin-bottom: 10px;
    }

    .balloons {
        font-size: 38px;
        margin: 15px 0;
        animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    .message {
        font-size: 15px;
        line-height: 1.6;
        color: #555;
        margin: 15px 0;
    }

    .wish {
        background: linear-gradient(45deg, #ff4b5c, #ff758c);
        color: white;
        padding: 12px;
        border-radius: 25px;
        margin-top: 15px;
        animation: glow 2s infinite alternate;
    }

    @keyframes glow {
        from { box-shadow: 0 0 10px #ff758c; }
        to { box-shadow: 0 0 20px #ff4b5c; }
    }

    .footer {
        margin-top: 15px;
        font-size: 14px;
        color: #777;
    }

    /* Confetti */
    .confetti {
        position: absolute;
        top: -10px;
        width: 10px;
        height: 10px;
        animation: fall linear infinite;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
        }
    }
</style>
</head>
<body>

<!-- 🎵 Autoplay Birthday Music -->
<audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="scene">
    <div class="card">

        <!-- FRONT -->
        <div class="card-face front">
            <h1>Happy Birthday 🎂</h1>
            <p>click 🎁</p>
            <div style="font-size:50px;margin-top:20px;">🎉🎈</div>
        </div>

        <!-- BACK -->
        <div class="card-face back">
            <h2>My Dear Friend 💖</h2>

            <div class="balloons">🎈🎉🎁</div>

            <div class="message">
                On your special day, I wish you endless smiles, unforgettable moments,
                and success in everything you do.  
                Thank you for being such a beautiful part of my life ✨
            </div>

            <div class="wish">
                🎊 May all your dreams come true 🎊
            </div>

            <div class="footer">
                With love 💕 <br> — Your Friend
            </div>
        </div>

    </div>
</div>

<script>
    // Confetti Effect
    for (let i = 0; i < 40; i++) {
        let confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
        confetti.style.backgroundColor =
            ["#ff4b5c","#ffcd3c","#4d96ff","#6bcf63"][Math.floor(Math.random()*4)];
        document.body.appendChild(confetti);
    }
</script>

</body>
</html>
